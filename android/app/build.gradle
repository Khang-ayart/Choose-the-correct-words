plugins {
    id 'com.android.application'
}

android {
    namespace 'com.choosethecorrectword.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.choosethecorrectword.app"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.5.1"
    }

    signingConfigs {
        ctcw {
            storeFile file('ctcw.keystore')
            storePassword 'ctcw-alpha-2026'
            keyAlias 'ctcw'
            keyPassword 'ctcw-alpha-2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ctcw
        }
        release {
            signingConfig signingConfigs.ctcw
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }
}
