plugins {
    id 'com.android.application'
}

android {
    namespace 'com.choosethecorrectword.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.choosethecorrectword.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1-alpha"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }
}
