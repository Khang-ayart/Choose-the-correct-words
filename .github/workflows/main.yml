name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChooseTheCorrectWord.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChooseTheCorrectWord-apk
          path: ChooseTheCorrectWord.apk
      - name: Publish release (when www/version.json has a new version)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;print(json.load(open('www/version.json'))['versionName'])")
          NOTES=$(python3 -c "import json;print(json.load(open('www/version.json'))['notes'])")
          TAG="v${VER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            cp ChooseTheCorrectWord.apk "ChooseTheCorrectWord-${TAG}.apk"
            gh release create "$TAG" "ChooseTheCorrectWord-${TAG}.apk" --target "$GITHUB_SHA" --title "Choose The Correct Word ${TAG}" --notes "$NOTES"
          fi
